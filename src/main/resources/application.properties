# Application Name
spring.application.name=Sabscribekaro

# ===============================
# MySQL Database Configuration
# ===============================
# ✅ Railway pe DATABASE_URL inject hota hai, locally apna use hoga
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/sabscribekaro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# Thymeleaf Configuration
# ===============================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===============================
# Server Configuration
# ===============================
# ✅ Railway pe PORT inject hota hai, locally 8080 use hoga
server.port=${PORT:8080}

# ===============================
# File Upload Size
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sabscribekaroai@gmail.com}
spring.mail.password=${MAIL_PASSWORD:jymu bxii foed qlhg}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true